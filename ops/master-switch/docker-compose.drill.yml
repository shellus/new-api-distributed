x-app-environment: &app-environment
  SQL_DSN: postgresql://${DRILL_DB_USER}:${DRILL_DB_PASSWORD}@postgres:5432/${DRILL_DB_NAME}
  REDIS_CONN_STRING: redis://redis:6379/0
  SESSION_SECRET: ${DRILL_SESSION_SECRET}
  TZ: Asia/Shanghai
  ERROR_LOG_ENABLED: "true"
  BATCH_UPDATE_ENABLED: "true"
  EDGE_DISTRIBUTED_ENABLED: "false"
  SYNC_UPSTREAM_BASE: ${SYNC_UPSTREAM_BASE:-}
  AUDIT_ENDPOINT_URL: ${AUDIT_ENDPOINT_URL:-}
  AUDIT_API_KEY: ${AUDIT_API_KEY:-}
  AUDIT_TIMEOUT_SECONDS: ${AUDIT_TIMEOUT_SECONDS:-3}
  AUDIT_MAX_BODY_BYTES: ${AUDIT_MAX_BODY_BYTES:-0}

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

x-app-common: &app-common
  restart: "no"
  command: --log-dir /app/logs
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - drill

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    restart: "no"
    environment:
      POSTGRES_USER: ${DRILL_DB_USER}
      POSTGRES_PASSWORD: ${DRILL_DB_PASSWORD}
      POSTGRES_DB: ${DRILL_DB_NAME}
      TZ: Asia/Shanghai
    volumes:
      - ${RUNTIME_DIR}/postgres:/var/lib/postgresql/data
    ports:
      - ${DRILL_BIND_ADDRESS}:${DRILL_POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRILL_DB_USER} -d ${DRILL_DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - drill

  redis:
    image: ${REDIS_IMAGE:-redis:latest}
    restart: "no"
    command: redis-server --save "" --appendonly no
    ports:
      - ${DRILL_BIND_ADDRESS}:${DRILL_REDIS_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      - drill

  original:
    <<: *app-common
    image: ${ORIGINAL_IMAGE}
    pull_policy: never
    profiles: ["original"]
    volumes:
      - ${RUNTIME_DIR}/app-data:/data
      - ${RUNTIME_DIR}/logs/original:/app/logs
    ports:
      - ${DRILL_BIND_ADDRESS}:${DRILL_APP_PORT}:3000
    healthcheck: *app-healthcheck

  master:
    <<: *app-common
    image: ${MASTER_IMAGE}
    pull_policy: never
    profiles: ["master"]
    volumes:
      - ${RUNTIME_DIR}/app-data:/data
      - ${RUNTIME_DIR}/logs/master:/app/logs
    ports:
      - ${DRILL_BIND_ADDRESS}:${DRILL_APP_PORT}:3000
    healthcheck: *app-healthcheck

networks:
  drill:
    driver: bridge
